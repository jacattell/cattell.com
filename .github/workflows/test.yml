# Runs the tests on every pull request and every change to main, including changes
# saved by the week notes editor.
#   test           npm test: builds the site and checks pages, security settings, page weight and both Workers
#   accessibility  checks pages against WCAG 2.2 AA with axe, in light and dark mode
# Actions are pinned to an exact commit, so a changed tag can't change what runs.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: .github/scripts/install-hugo.sh
      - run: npm test

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/a11y/package-lock.json
      - run: .github/scripts/install-hugo.sh
      - run: npm run build
      # The checker's own packages: used only here, never in the website.
      - run: npm ci --prefix test/a11y
      - run: npx --prefix test/a11y playwright install --with-deps chromium
      - run: node test/a11y/check.mjs public
