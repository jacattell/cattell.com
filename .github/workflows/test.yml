# Runs the tests (npm test) on every pull request and every change to main,
# including changes saved by the week notes editor. Many tests check security
# settings (the Content-Security-Policy, sign-in, size limits), so a failed run
# means something needs a look before or soon after it goes live.
# Actions are pinned to an exact commit, so a changed tag can't change what runs.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
