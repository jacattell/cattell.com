# Checks every link on the website, including links to other websites.
# Runs every Monday morning, when these settings change, and when started
# by hand (Actions tab > Check links > Run workflow). If a link is broken the run fails and GitHub
# emails you; the run's Summary lists the broken links.
# Sites to skip and other settings are in lychee.toml.
name: Check links

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    paths: [lychee.toml, .github/workflows/links.yml]

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --config lychee.toml
            --root-dir "${{ github.workspace }}/_site"
            --no-progress
            "_site/**/*.html"
          fail: true
