{{ define "main" }}
<div class="prose">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
</div>
<div id="chat-log" class="chat-log" data-api="{{ site.Params.api }}/chat" aria-label="Conversation" role="region" tabindex="0"></div>
<p id="chat-announce" class="visually-hidden" role="status"></p>
<form id="chat-form" class="chat-form" hidden>
  <label class="label" for="chat-input">Your question</label>
  <p class="hint" id="chat-hint">Press Enter to send. Press Shift and Enter for a new line.</p>
  <textarea id="chat-input" rows="3" maxlength="2000" aria-describedby="chat-hint" required></textarea>
  <div class="button-row">
    <button type="submit" id="chat-send" class="button">Send</button>
    <button type="button" id="chat-reset" class="button-secondary">Start again</button>
    <span id="chat-status" class="meta" role="status"></span>
  </div>
</form>
<noscript><p>This page needs JavaScript. You can <a href="/contact/">contact me</a> instead.</p></noscript>
{{ end }}
{{ define "scripts" }}
{{- with resources.Get "js/chat.js" | minify | fingerprint }}
<script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
{{- end }}
{{ end }}
